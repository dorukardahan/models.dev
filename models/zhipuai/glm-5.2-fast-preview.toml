# Model facts: 0G Compute catalog, https://router-api.0g.ai/v1/models (accessed 2026-11-22).
# 0G serves this id without a separate model card, so limits, modalities and release date are the
# catalog values; the lab behind the id is named in the family and (when open) the weights link.
# Sampling: the router lists temperature, top_p and top_k in supported_parameters.
# Faster serving of the same model: GLM-5.2 weights (https://huggingface.co/zai-org/GLM-5.2).
schema = 2
name = "GLM-5.2 Fast Preview"
description = "Faster-serving preview of GLM-5.2 for latency-sensitive long-horizon agent work"
family = "glm"
open_weights = false
release_date = "2026-11-22"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 1_179_648
output = 131_072

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/zai-org/GLM-5.2"

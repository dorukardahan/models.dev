# Model facts: 0G Compute catalog, https://router-api.0g.ai/v1/models (accessed 2026-11-22).
# 0G serves the ERNIE Light DT tier text-only with a 512K-token context. Sampling and tool flags
# follow the other ERNIE lab files on models.dev.
schema = 2
name = "ERNIE Light DT 1.0"
description = "Lightweight ERNIE tier with a long context for high-volume document work"
family = "ernie"
open_weights = false
release_date = "2026-11-22"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 524_288
output = 131_072
